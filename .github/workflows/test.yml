name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [core, identity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core
        if: matrix.mode == 'core'
        run: python -m pip install -e .
      - name: Install identity extra
        if: matrix.mode == 'identity'
        run: python -m pip install -e '.[identity]'
      - run: python -m unittest discover -s tests -v
  policy-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[identity]' playwright
      - name: Check policy UI and delayed export regression in runner Chrome
        run: python scripts/check_policy_ui.py --browser /usr/bin/google-chrome
      - name: Check source-scoped runtime monitoring in runner Chrome
        run: python scripts/check_runtime_ui.py --browser /usr/bin/google-chrome
