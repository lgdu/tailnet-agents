[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailnet-agents"
version = "0.1.0"
description = "Discover heterogeneous agents across a Tailscale network"
requires-python = ">=3.11"

[project.scripts]
tailnet-agent-registry = "tailnet_agents.registry:main"

[tool.setuptools.packages.find]
include = ["tailnet_agents*"]
