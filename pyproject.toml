[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailnet-agents"
version = "0.32.0"
description = "Discover heterogeneous agents across a Tailscale network"
requires-python = ">=3.11"

[project.scripts]
tailnet-adapters = "tailnet_agents.adapters:main"
tailnet-agent-registry = "tailnet_agents.registry:main"
tailnet-agent-bridge = "tailnet_agents.bridge:main"
tailnet-agents = "tailnet_agents.cli:main"
tailnet-agents-mcp = "tailnet_agents.mcp:main"
tailnet-agents-ui = "tailnet_agents.ui:main"
tailnet-verified-directory = "tailnet_agents.admission_server:main"
tailnet-policy-sync = "tailnet_agents.policy_sync:main"
tailnet-verified-register = "tailnet_agents.verified_client:main"
tailnet-discover = "tailnet_agents.discovery:main"
tailnet-grant-install = "tailnet_agents.grant_install:main"
tailnet-agent-runtime = "tailnet_agents.agent_runtime:main"
tailnet-presence = "tailnet_agents.presence:main"
tailnet-tasks = "tailnet_agents.task_client:main"
tailnet-tasks-mcp = "tailnet_agents.task_mcp:main"
tailnet-messages = "tailnet_agents.message_client:main"
tailnet-peer-presence = "tailnet_agents.peer_presence:main"

[tool.setuptools.packages.find]
include = ["tailnet_agents*"]

[tool.setuptools.package-data]
tailnet_agents = ["web/*.html", "web/*.css", "web/*.js"]

[project.optional-dependencies]
identity = ["cryptography>=44"]
